services:
  - type: web
    name: sree-abhyasa-college
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: sh -c "if [ -n \"$DATABASE_URL\" ]; then npx drizzle-kit push --force; fi && npm run start"
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
